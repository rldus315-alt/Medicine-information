<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의약품 정보 | Medicine Info</title>
  <script>
    (function() {
      var p = location.pathname;
      if (p.indexOf('/Medicine-information') === 0) {
        var base = location.origin + '/Medicine-information/';
        document.write('<base href="' + base + '">');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">💊 의약품 정보</h1>
      <nav class="nav">
        <button class="nav-btn active" data-view="search">검색</button>
        <button class="nav-btn" data-view="interaction">상호작용</button>
        <button class="nav-btn" data-view="pill">알약 식별</button>
        <button class="nav-btn" data-view="medications">내 복용약</button>
      </nav>
    </header>

    <main class="main">
      <!-- 검색 뷰 -->
      <section class="view view-search active" id="viewSearch">
        <div class="search-box-wrapper">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="의약품명 검색 (예: 타이레놀, 게보린, 판콜, 아스피린...)" autocomplete="off">
            <button class="btn btn-primary" id="searchBtn">검색</button>
          </div>
          <div class="search-suggestions" id="searchSuggestions"></div>
          <p class="search-hint">한국 의약품 3,357건 · 효능·사용법·주의사항·부작용 포함</p>
        </div>
        <div class="body-part-section">
          <p class="body-part-title">부위별로 찾기 · 아이콘을 클릭하세요</p>
          <div class="body-icon-grid">
            <div class="body-icon-cell body-part" data-part="head" title="머리">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><ellipse cx="16" cy="14" rx="10" ry="12" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>머리</span>
            </div>
            <div class="body-icon-cell body-part" data-part="eye" title="눈">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><ellipse cx="16" cy="16" rx="8" ry="6" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="16" cy="16" r="2" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>눈</span>
            </div>
            <div class="body-icon-cell body-part" data-part="nose" title="코">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><path d="M16 6 L16 26 M14 8 Q16 10 18 8" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>코</span>
            </div>
            <div class="body-icon-cell body-part" data-part="throat" title="목">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><rect x="10" y="8" width="12" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>목</span>
            </div>
            <div class="body-icon-cell body-part" data-part="chest" title="가슴">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><path d="M6 12 Q16 8 26 12 Q28 18 24 22 Q16 26 8 22 Q4 18 6 12" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>가슴</span>
            </div>
            <div class="body-icon-cell body-part" data-part="stomach" title="위">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><path d="M8 10 Q16 6 24 10 Q26 18 22 24 Q16 28 10 24 Q6 18 8 10" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>위</span>
            </div>
            <div class="body-icon-cell body-part" data-part="heart" title="심장">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><path d="M16 26 C8 20 6 14 10 10 C14 6 16 10 16 10 C16 10 18 6 22 10 C26 14 24 20 16 26" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>심장</span>
            </div>
            <div class="body-icon-cell body-part" data-part="kidney" title="신장">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><ellipse cx="10" cy="16" rx="6" ry="8" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="22" cy="16" rx="6" ry="8" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>신장</span>
            </div>
            <div class="body-icon-cell body-part" data-part="bloodpressure" title="혈압">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><path d="M6 20 L10 14 L14 20 L18 10 L22 16 L26 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>혈압</span>
            </div>
            <div class="body-icon-cell body-part" data-part="arm" title="팔">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><ellipse cx="16" cy="16" rx="4" ry="12" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>팔</span>
            </div>
            <div class="body-icon-cell body-part" data-part="leg" title="다리">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><ellipse cx="16" cy="16" rx="5" ry="12" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>다리</span>
            </div>
            <div class="body-icon-cell body-part" data-part="joint" title="관절">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><path d="M8 20 L16 8 L24 20" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="16" cy="14" r="4" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>관절</span>
            </div>
            <div class="body-icon-cell body-part" data-part="skin" title="피부">
              <svg viewBox="0 0 32 32" class="body-icon-svg"><circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1"/><path d="M10 16 Q16 10 22 16 Q16 22 10 16" fill="none" stroke="currentColor" stroke-width="1"/></svg>
              <span>피부</span>
            </div>
          </div>
        </div>
        <div class="search-results" id="searchResults"></div>
      </section>

      <!-- 상세 정보 뷰 -->
      <section class="view view-detail hidden" id="viewDetail">
        <button class="back-btn" id="backBtn">← 목록으로</button>
        <div class="detail-content" id="detailContent"></div>
      </section>

      <!-- 상호작용 검사 뷰 -->
      <section class="view view-interaction hidden" id="viewInteraction">
        <h2>약물 상호작용 검사</h2>
        <p class="subtitle">복용 중인 약을 추가하고 상호작용을 확인하세요</p>
        <div class="interaction-input">
          <input type="text" id="interactionDrugInput" placeholder="의약품명 입력">
          <button class="btn btn-primary" id="addDrugBtn">추가</button>
        </div>
        <div class="drug-list" id="interactionDrugList"></div>
        <button class="btn btn-secondary" id="checkInteractionBtn">상호작용 검사</button>
        <div class="interaction-result" id="interactionResult"></div>
      </section>

      <!-- 알약 식별 뷰 -->
      <section class="view view-pill hidden" id="viewPill">
        <h2>알약 식별</h2>
        <p class="subtitle">알약의 모양, 색상, 각인을 입력하세요</p>
        <div class="pill-form">
          <div class="form-row">
          <div class="form-group">
            <label>모양</label>
            <select id="pillShape">
              <option value="">선택</option>
              <option value="round">원형</option>
              <option value="oval">타원형</option>
              <option value="capsule">캡슐형</option>
              <option value="rectangle">사각형</option>
              <option value="diamond">다이아몬드</option>
              <option value="hexagon">육각형</option>
              <option value="octagon">팔각형</option>
              <option value="triangle">삼각형</option>
            </select>
          </div>
          <div class="form-group">
            <label>색상</label>
            <select id="pillColor">
              <option value="">선택</option>
              <option value="white">흰색</option>
              <option value="yellow">노란색</option>
              <option value="orange">주황색</option>
              <option value="red">빨간색</option>
              <option value="pink">분홍색</option>
              <option value="blue">파란색</option>
              <option value="green">초록색</option>
              <option value="brown">갈색</option>
              <option value="gray">회색</option>
            </select>
          </div>
          <div class="form-group">
            <label>각인 (문자/숫자)</label>
            <input type="text" id="pillImprint" placeholder="예: G4, 500">
          </div>
          </div>
          <button class="btn btn-primary" id="identifyPillBtn">알약 찾기</button>
        </div>
        <div class="pill-results" id="pillResults"></div>
      </section>

      <!-- 내 복용약 뷰 -->
      <section class="view view-medications hidden" id="viewMedications">
        <h2>내 복용 약 목록</h2>
        <p class="subtitle">현재 복용 중인 약을 저장하고, 상호작용·알레르기 검사를 할 수 있습니다</p>
        <div class="medication-input-wrapper" style="position:relative;">
          <div class="medication-input">
            <input type="text" id="medicationInput" placeholder="의약품명 입력" autocomplete="off">
            <button class="btn btn-primary" id="addMedicationBtn">추가</button>
          </div>
          <div class="medication-suggestions" id="medicationSuggestions"></div>
        </div>
        <div class="medication-list" id="medicationList"></div>
        <div class="medication-actions">
          <button class="btn btn-secondary" id="checkAllergyBtn">알레르기 검사</button>
          <button class="btn btn-secondary" id="checkMyInteractionsBtn">상호작용 검사</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>⚠️ 본 정보는 참고용이며, 의료 상담을 대체하지 않습니다. 전문가와 상담하세요.</p>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>if(typeof DATA_GO_KR_API_KEY==='undefined'){var DATA_GO_KR_API_KEY='';}</script>
  <script src="data.js"></script>
  <script src="korean-drugs.js"></script>
  <script>if(typeof KOREAN_DRUG_DATABASE==='undefined'){var KOREAN_DRUG_DATABASE=[];}</script>
  <script src="app.js"></script>
  <script>
    if (typeof KOREAN_TO_ENGLISH === 'undefined') {
      document.body.innerHTML = '<p style="padding:2rem;color:red;">data.js를 불러올 수 없습니다. index.html과 같은 폴더에 data.js, app.js, styles.css가 있는지 확인하세요.</p>';
    }
  </script>
</body>
</html>
