<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의약품 정보 | Medicine Info</title>
  <script>
    (function() {
      var p = location.pathname;
      if (p.indexOf('/Medicine-information') === 0) {
        var base = location.origin + '/Medicine-information/';
        document.write('<base href="' + base + '">');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">💊 의약품 정보</h1>
      <nav class="nav">
        <button class="nav-btn active" data-view="search">검색</button>
        <button class="nav-btn" data-view="interaction">상호작용</button>
        <button class="nav-btn" data-view="pill">알약 식별</button>
        <button class="nav-btn" data-view="medications">내 복용약</button>
      </nav>
    </header>

    <main class="main">
      <!-- 검색 뷰 -->
      <section class="view view-search active" id="viewSearch">
        <div class="search-box-wrapper">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="의약품명 검색 (예: 타이레놀, 게보린, 판콜, 아스피린...)" autocomplete="off">
            <button class="btn btn-primary" id="searchBtn">검색</button>
          </div>
          <div class="search-suggestions" id="searchSuggestions"></div>
          <p class="search-hint">한국 의약품 3,357건 · 효능·사용법·주의사항·부작용 포함</p>
        </div>
        <div class="search-results" id="searchResults"></div>
      </section>

      <!-- 상세 정보 뷰 -->
      <section class="view view-detail hidden" id="viewDetail">
        <button class="back-btn" id="backBtn">← 목록으로</button>
        <div class="detail-content" id="detailContent"></div>
      </section>

      <!-- 상호작용 검사 뷰 -->
      <section class="view view-interaction hidden" id="viewInteraction">
        <h2>약물 상호작용 검사</h2>
        <p class="subtitle">복용 중인 약을 추가하고 상호작용을 확인하세요</p>
        <div class="interaction-input-wrapper" style="position:relative;">
          <div class="interaction-input">
            <input type="text" id="interactionDrugInput" placeholder="의약품명 입력" autocomplete="off">
            <button class="btn btn-primary" id="addDrugBtn">추가</button>
          </div>
          <div class="interaction-suggestions" id="interactionSuggestions"></div>
        </div>
        <div class="drug-list" id="interactionDrugList"></div>
        <button class="btn btn-secondary" id="checkInteractionBtn">상호작용 검사</button>
        <div class="interaction-result" id="interactionResult"></div>
      </section>

      <!-- 알약 식별 뷰 -->
      <section class="view view-pill hidden" id="viewPill">
        <h2>알약 식별</h2>
        <p class="subtitle">알약의 모양, 색상, 각인을 입력하세요</p>
        <div class="pill-form">
          <div class="form-row">
          <div class="form-group">
            <label>모양</label>
            <select id="pillShape">
              <option value="">선택</option>
              <option value="round">원형</option>
              <option value="oval">타원형</option>
              <option value="capsule">캡슐형</option>
              <option value="rectangle">사각형</option>
              <option value="diamond">다이아몬드</option>
              <option value="hexagon">육각형</option>
              <option value="octagon">팔각형</option>
              <option value="triangle">삼각형</option>
            </select>
          </div>
          <div class="form-group">
            <label>색상</label>
            <select id="pillColor">
              <option value="">선택</option>
              <option value="white">흰색</option>
              <option value="yellow">노란색</option>
              <option value="orange">주황색</option>
              <option value="red">빨간색</option>
              <option value="pink">분홍색</option>
              <option value="blue">파란색</option>
              <option value="green">초록색</option>
              <option value="brown">갈색</option>
              <option value="gray">회색</option>
            </select>
          </div>
          <div class="form-group">
            <label>각인 (문자/숫자)</label>
            <input type="text" id="pillImprint" placeholder="예: G4, 500">
          </div>
          </div>
          <button class="btn btn-primary" id="identifyPillBtn">알약 찾기</button>
        </div>
        <div class="pill-results" id="pillResults"></div>
      </section>

      <!-- 내 복용약 뷰 -->
      <section class="view view-medications hidden" id="viewMedications">
        <h2>내 복용 약 목록</h2>
        <p class="subtitle">현재 복용 중인 약을 저장하고, 상호작용·알레르기 검사를 할 수 있습니다</p>
        <div class="medication-input-wrapper" style="position:relative;">
          <div class="medication-input">
            <input type="text" id="medicationInput" placeholder="의약품명 입력" autocomplete="off">
            <button class="btn btn-primary" id="addMedicationBtn">추가</button>
          </div>
          <div class="medication-suggestions" id="medicationSuggestions"></div>
        </div>
        <div class="medication-table-wrapper">
          <table class="medication-table" id="medicationTable">
            <thead>
              <tr>
                <th>번호</th>
                <th>의약품명</th>
                <th>복용법</th>
                <th>비고</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="medicationList"></tbody>
          </table>
          <p class="medication-empty" id="medicationEmpty">등록된 약이 없습니다. 위에서 의약품을 검색해 추가하세요.</p>
        </div>
        <div class="medication-actions">
          <button class="btn btn-secondary" id="checkAllergyBtn">알레르기 검사</button>
          <button class="btn btn-secondary" id="checkMyInteractionsBtn">상호작용 검사</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>⚠️ 본 정보는 참고용이며, 의료 상담을 대체하지 않습니다. 전문가와 상담하세요.</p>
    </footer>
  </div>

  <!-- 복약 안내문 모달 -->
  <div class="med-guide-overlay" id="medGuideOverlay">
    <div class="med-guide-modal">
      <div class="med-guide-header">
        <h2>복약 안내문</h2>
        <div class="med-guide-actions">
          <button class="btn btn-secondary" id="medGuidePrintBtn">🖨️ 인쇄</button>
          <button class="btn btn-secondary" id="medGuideCloseBtn">닫기</button>
        </div>
      </div>
      <div class="med-guide-body" id="medGuideBody"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>if(typeof DATA_GO_KR_API_KEY==='undefined'){var DATA_GO_KR_API_KEY='';}</script>
  <script src="data.js"></script>
  <script src="korean-drugs.js"></script>
  <script>if(typeof KOREAN_DRUG_DATABASE==='undefined'){var KOREAN_DRUG_DATABASE=[];}</script>
  <script src="app.js"></script>
  <script>
    if (typeof KOREAN_TO_ENGLISH === 'undefined') {
      document.body.innerHTML = '<p style="padding:2rem;color:red;">data.js를 불러올 수 없습니다. index.html과 같은 폴더에 data.js, app.js, styles.css가 있는지 확인하세요.</p>';
    }
  </script>
</body>
</html>
